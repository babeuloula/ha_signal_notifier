send_message:
  name: Envoyer un message Signal
  description: Envoie un message à un ou plusieurs destinataires via l'API Signal.
  fields:
    message:
      name: Message
      description: Le contenu du message à envoyer.
      required: true
      example: "Bonjour depuis Home Assistant !"
      selector:
        text:
          multiline: true
    groups:
      name: Groupes
      description: Un ou plusieurs groupes Signal destinataires (liste récupérée depuis l'API Signal).
      required: false
      example: "group.ABCDEF123456="
      selector:
        select:
          multiple: true
          custom_value: true
          options: []
    contacts:
      name: Contacts
      description: Un ou plusieurs contacts Signal destinataires (liste récupérée depuis l'API Signal).
      required: false
      example: "+33612345678"
      selector:
        select:
          multiple: true
          custom_value: true
          options: []
    recipients:
      name: Numéros de téléphone
      description: Numéros de téléphone supplémentaires, séparés par des points-virgules (format international).
      required: false
      example: "+33612345678;+33600000000"
      selector:
        text:
    notify_self:
      name: S'envoyer à soi-même
      description: Si activé, le message sera également envoyé au numéro de l'expéditeur.
      required: true
      default: true
      selector:
        boolean:
    text_mode:
      name: Mode texte
      description: Définit comment le texte doit être traité. 'styled' permet le formatage.
      required: true
      default: "styled"
      selector:
        select:
          options:
            - "normal"
            - "styled"
    attachment_entity_id:
      name: Pièce(s) jointe(s)
      description: Une ou plusieurs entités caméra ou image dont l'image sera jointe au message (ex. le snapshot d'une sonnette Ring).
      required: false
      selector:
        entity:
          multiple: true
          filter:
            domain:
              - camera
              - image
